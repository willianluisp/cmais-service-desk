let toastTimer;function toast(message){const el=$('#toastRegion');el.innerHTML=`<div class="toast">${I('info')}<span>${esc(message)}</span></div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.innerHTML=''},3600)}

quick="${t.id}"><span class="shortcut-icon">${I(t.icon)}</span><span class="shortcut-main"><b>${t.name}</b><small>${t.desc}</small></span>${I('chevron',15)}</button>`).join('')}<div class="info-note" style="margin-top:13px">${I('info')}<div>Não sabe qual opção escolher? Clique em <b>Abrir chamado</b> e siga as etapas. Você pode voltar sempre que precisar.</div></div></section></div>`}
function wizard(){if(state.successId)return successPage();const w=state.wizard;const stepNames=['Empresa','Departamento','Assunto','Informações','Revisão'];let inner='';if(w.step===0){inner=`<h2>Para qual empresa é a solicitação?</h2><p class="subline">Escolha a empresa em que você está trabalhando. Isso ajuda a direcionar seu pedido.</p>${w.form?`<div class="info-note" style="margin-bottom:17px">${I('check')}<span>Assunto escolhido: <b>${esc(state.formDrafts.find(f=>f.id===w.form)?.name)}</b>. Após escolher a empresa, você poderá descrever seu pedido.</span></div>`:''}<div class="choice-grid">${companies.map((v,i)=>choice('company',i,v,['Contabilidade e atendimento','Consultoria e serviços','Serviços compartilhados'][i],'building',w.company===i)).join('')}</div>`}if(w.step===1){inner=`<h2>Qual departamento precisa de ajuda?</h2><p class="subline">Selecione o setor relacionado ao seu pedido.</p><div class="choice-grid">${departments.map((v,i)=>choice('department',i,v,['Computadores, sistemas e acessos','Rotinas de pessoas e equipes','Documentos e obrigações fiscais','Registros e lançamentos','Contratos e atos societários'][i],['monitor','users','file','layout','building'][i],w.department===i)).join('')}</div>`}if(w.step===2){const matches=state.formDrafts.filter(t=>t.department===w.department);inner=`<h2>Sobre o que você precisa de ajuda?</h2><p class="subline">Escolha o tipo de solicitação. Aparecerão apenas os formulários relevantes ao setor escolhido.</p>${matches.length?`<div class="choice-grid">${matches.map(t=>choice('form',t.id,t.name,t.desc,t.icon,w.form===t.id)).join('')}</div>`:empty('Não há formulários disponíveis para este setor','Volte e escolha outro departamento ou entre em contato com o administrador.')}`}
if(w.step===3){const ft=state.formDrafts.find(f=>f.id===w.form);inner=`<h2>Conte um pouco mais sobre sua solicitação</h2><p class="subline">Formulário: <strong>${esc(ft?.name||'Solicitação')}</strong>. Preencha as informações para ajudar a equipe a entender o pedido.</p><div class="field"><label for="wtitle">Assunto <span class="required">*</span></label><input id="wtitle" data-wfield="title" maxlength="110" placeholder="Ex.: Não consigo acessar a pasta do setor" value="${esc(w.title)}"><div class="hint">Escreva uma frase curta que explique o que aconteceu.</div></div><div class="field"><label for="wdesc">O que você precisa? <span class="required">*</span></label><textarea id="wdesc" data-wfield="description" maxlength="2000" placeholder="Descreva a situação e o que você já tentou fazer...">${esc(w.description)}</textarea><div class="hint">Evite colocar senhas ou dados confidenciais neste campo.</div></div><div class="two-fields"><div class="field"><label for="wurgency">Urgência</label><select id="wurgency" data-wfield="urgency">${['Baixa','Normal','Alta'].map(v=>`<option ${w.urgency===v?'selected':''}>${v}</option>`).join('')}</select><div class="hint">Selecione Alta apenas se estiver impedindo o trabalho.</div></div><div class="field"><label for="wdetails">Local ou equipamento (opcional)</label><input id="wdetails" data-wfield="details" placeholder="Ex.: Sala 2, computador 08" value="${esc(w.details)}"></div></div><div class="field"><label>Anexos (opcional)</label><label class="upload" for="wfile">${I('upload',21)}<b>Clique para escolher arquivos</b><small>Até 5 arquivos PDF, PNG ou JPEG • 2 MB por arquivo</small><input id="wfile" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg"></label><div>${w.files.map((f,i)=>`<span class="file-tag">${I('paperclip',13)} ${esc(f.name)} <button title="Remover anexo" data-removefile="${i}">${I('close',13)}</button></span>`).join('')}</div></div>`}
if(w.step===4){inner=`<h2>Revise antes de enviar</h2><p class="subline">Confira os dados do pedido. Você pode voltar e corrigir qualquer informação.</p><div>${[['Empresa',companies[w.company]],['Departamento',departments[w.department]],['Tipo',state.formDrafts.find(f=>f.id===w.form)?.name],['Assunto',w.title],['Descrição',w.description],['Urgência',w.urgency],['Local/equipamento',w.details||'Não informado'],['Anexos',w.files.length?`${w.files.length} arquivo(s)`: 'Nenhum']].map(([k,v])=>`<div class="review-line"><strong>${esc(k)}</strong><span>${esc(v)}</span></div>`).join('')}</div><div class="info-note" style="margin-top:17px">${I('shield')}<span>Seu pedido será registrado e poderá ser acompanhado em <b>Meus chamados</b>. Arquivos ficam privados conforme as permissões do sistema.</span></div>`}
return `${pageHeading('Nova solicitação','Abrir chamado','Siga as etapas para enviar seu pedido.') }<div class="wizard-layout"><section class="card wizard-main"><div class="stepper" aria-label="Etapas da solicitação">${stepNames.map((s,i)=>`<div class="step ${i===w.step?'active':i<w.step?'past':''}"><span class="step-dot">${i<w.step?I('check',12):i+1}</span><span class="step-label">${s}</span></div>`).join('')}</div>${inner}<div class="wizard-actions">${btn(`${I('back',16)} ${w.step?'Voltar':'Cancelar'}`,'wizardBack')}${btn(`${w.step===4?'Enviar solicitação':'Continuar'} ${I(w.step===4?'send':'arrow',16)}`,'wizardNext','btn-primary')}</div></section><aside class="card wizard-aside"><h3>Resumo da solicitação</h3>${[['Empresa',companies[w.company]],['Departamento',departments[w.department]],['Tipo',state.formDrafts.find(f=>f.id===w.form)?.name]].map(([k,v],i)=>`<div class="aside-step"><span class="${v?'done':''}">${v?I('check',13):i+1}</span><div><strong>${k}</strong><small>${esc(v||'Aguardando seleção')}</small></div></div>`).join('')}<div class="info-note" style="margin-top:16px">${I('help')}<span>Precisa corrigir uma etapa? Use o botão <b>Voltar</b>.</span></div></aside></div>`}
function choice(kind,id,title,desc,ico,selected){return `<button class="choice ${selected?'selected':''}" data-choose="${kind}" data-value="${esc(id)}" aria-pressed="${selected}"><span class="choice-icon">${I(ico)}</span><span style="flex:1"><b>${esc(title)}</b><small>${esc(desc)}</small></span>${selected?`<span class="choice-check">${I('check',16)}</span>`:''}</button>`}
function successPage(){return `<div class="card success"><div class="success-symbol">${I('check',33)}</div><div class="eyebrow">Solicitação registrada na demonstração</div><h2>Seu chamado foi aberto!</h2><p>Você pode acompanhar o andamento na área <strong>Meus chamados</strong>. Guarde o protocolo para facilitar a consulta.</p><div class="protocol">${esc(state.successId)}</div><div style="display:flex;justify-content:center;gap:9px;flex-wrap:wrap">${btn(`${I('eye')} Ver meu chamado`,'viewCreated','btn-primary')}${btn(`${I('plus')} Abrir outro`,'openWizard')}</div><p style="font-size:10px;margin-top:22px">Esta é uma simulação. Nenhum chamado foi enviado a um servidor.</p></div>`}
function empty(title,desc){return `<div class="empty"><div class="empty-icon">${I('search',24)}</div><b>${esc(title)}</b><p>${esc(desc)}</p></div>`}
function listTickets(admin){let filtered=state.tickets.filter(t=>(admin||t.requester==='Marina Souza')&&!state.deletedTickets.includes(t.id));if(state.filter!=='Todos')filtered=filtered.filter(t=>t.status===state.filter);if(state.search.trim())filtered=filtered.filter(t=>[t.id,t.title,t.form,companies[t.company],t.requester].join(' ').toLowerCase().includes(state.search.trim().toLowerCase()));const total=filtered.length;const pages=Math.max(1,Math.ceil(total/state.perPage));state.pageNum=Math.min(state.pageNum,pages);const start=(state.pageNum-1)*state.perPage;const visible=filtered.slice(start,start+state.perPage);return `${pageHeading('Atendimento',admin?'Todos os chamados':'Meus chamados',admin?'Gerencie as solicitações autorizadas para sua equipe.':'Consulte os pedidos que você abriu e veja o andamento.',btn(`${I('plus')} Novo chamado`,'openWizard','btn-primary'))}<div class="card"><div class="toolbar"><div class="toolbar-left"><label class="search-wrap">${I('search',16)}<span class="visually-hidden">Buscar chamados</span><input class="search-input" id="searchTickets" placeholder="Buscar por assunto ou protocolo" value="${esc(state.search)}"></label><select class="filter" id="statusFilter" aria-label="Filtrar por situação"><option value="Todos">Todas as situações</option>${['Aguardando atendimento','Em andamento','Concluído','Cancelado'].map(x=>`<option ${state.filter===x?'selected':''}>${x}</option>`).join('')}</select></div><span class="small muted">${total} ${total===1?'solicitação':'solicitações'}</span></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Protocolo</th><th>Assunto</th><th>Empresa</th>${admin?'<th>Solicitante</th>':''}<th>Situação</th><th>Prioridade</th><th>Aberto em</th><th>Ação</th></tr></thead><tbody>${visible.map(t=>`<tr><td><strong>${esc(t.id)}</strong></td><td><strong>${esc(t.title)}</strong><div class="small muted" style="margin-top:4px">${esc(t.form)}</div></td><td>${esc(companies[t.company])}</td>${admin?`<td>${esc(t.requester)}</td>`:''}<td>${statusPill(t.status)}</td><td>${priorityPill(t.priority)}</td><td>${fmt(t.created)}</td><td><button class="btn btn-sm" data-ticket="${t.id}">Ver detalhes ${I('chevron',13)}</button></td></tr>`).join('')}</tbody></table>${!total?empty('Nenhum chamado encontrado','Tente outra pesquisa ou altere o filtro.'):''}</div><div class="table-pagination"><span>Exibindo ${total?start+1:0}–${Math.min(start+state.perPage,total)} de ${total}</span><div>${btn(`${I('back',13)} Anterior`,'pagePrev','btn-sm')}${' '}<span style="margin:0 9px">${state.pageNum} de ${pages}</span>${btn(`Próximo ${I('chevron',13)}`,'pageNext','btn-sm')}</div></div></div>`}
function detail(){const t=currentTicket();if(!t||(!state.admin&&t.requester!=='Marina Souza')||state.deletedTickets.includes(t.id))return `${pageHeading('Acesso limitado','Chamado não disponível','Você não tem permissão para ver esta solicitação.')}${btn('Voltar','openList')}`;return `${pageHeading('Detalhes do chamado',esc(t.id),esc(t.title),`${btn(`${I('back')} Voltar`,'openList')}${state.admin?btn(`${I('trash')} Excluir`,'askDelete','btn-danger'):''}`)}<div class="detail-grid"><div><section class="card detail-card" style="margin-bottom:17px"><div style="display:flex;gap:8px;margin-bottom:20px">${statusPill(t.status)}${priorityPill(t.priority)}</div><h3>Informações da solicitação</h3><div class="detail-meta">${[['Empresa',companies[t.company]],['Departamento',departments[t.department]],['Solicitante',t.requester],['Responsável',t.assignee],['Abertura',fmt(t.created)],['Protocolo',t.id]].map(([key,val])=>`<div><span class="meta-label">${key}</span><span class="meta-value">${esc(val)}</span></div>`).join('')}</div><div style="border-top:1px solid var(--line);padding-top:18px"><h3>Descrição</h3><p class="detail-description">${esc(t.description)}</p></div><div style="margin-top:19px;border-top:1px solid var(--line);padding-top:17px"><h3>Comentários</h3>${t.comments.map(c=>`<div class="comment"><b>${esc(c.author)}</b><small style="float:right">${esc(c.date)}</small><p>${esc(c.body)}</p></div>`).join('')||'<p class="small muted">Ainda não há comentários.</p>'}<div class="field" style="margin-top:16px"><label for="newComment">Adicionar comentário</label><textarea id="newComment" placeholder="Escreva uma atualização ou informação útil..." style="min-height:83px"></textarea></div>${btn(`${I('send')} Enviar comentário`,'sendComment','btn-primary')}</div></section></div><aside><section class="card detail-card" style="margin-bottom:17px"><h3>Histórico de atividades</h3><ol class="timeline"><li><span class="timeline-dot"></span><div><b>Estado atual: ${esc(t.status)}</b><small>Última atualização</small></div></li><li><span class="timeline-dot"></span><div><b>Chamado registrado</b><small>${fmt(t.created)}</small></div></li></ol></section><section class="card detail-card"><h3>Integrações e privacidade</h3><div class="settings-row"><div><b>Microsoft Planner</b><p>${state.plannerConnected?'Painel de integração disponível ao administrador.':'Sem sincronização ativa nesta demonstração.'}</p></div>${I('plug',17)}</div><div class="info-note" style="margin-top:13px">${I('lock')}<span>Somente usuários autorizados devem ter acesso aos dados e anexos deste chamado.</span></div>${state.admin?`<div style="margin-top:14px">${btn('Marcar como concluído','completeTicket','btn-sm btn-secondary')}</div>`:''}</section></aside></div>`}
function adminHeading(which,subtitle,actions=''){return pageHeading('Administração',which,subtitle,actions)}
function adminForms(){if(state.formBuilder)return formBuilder();return `${adminHeading('Formulários','Organize os tipos de solicitação exibidos aos colaboradores.',btn(`${I('plus')} Novo formulário`,'newForm','btn-primary'))}<div class="card card-pad"><div class="info-note" style="margin-bottom:16px">${I('info')}<span>O colaborador vê somente os formulários publicados e pertinentes ao departamento selecionado. Esta tela demonstra o construtor visual.</span></div><div class="admin-list">${state.formDrafts.map(t=>`<div class="admin-item"><span class="mini-icon">${I(t.icon)}</span><div class="content"><b>${esc(t.name)}</b><small>${esc(departments[t.department])} • ${esc(t.desc)}</small></div><span class="pill green">Publicado</span><div class="actions"><button class="btn btn-sm" data-previewform="${t.id}">${I('eye',14)} Visualizar</button><button class="btn btn-sm" data-editform="${t.id}">${I('edit',14)} Editar</button></div></div>`).join('')}</div></div>`}
function formBuilder(){return `${adminHeading('Construtor de formulário','Crie campos sem precisar programar.',btn('Voltar à lista','builderBack'))}<div class="settings-grid"><section class="card card-pad"><h3 class="section-heading" style="margin-bottom:22px">Configuração</h3><div class="field"><label for="builderName">Nome do formulário <span class="required">*</span></label><input id="builderName" value="${esc(state.builderName)}" placeholder="Ex.: Solicitação de suporte"></div><div class="field"><label for="builderDept">Departamento</label><select id="builderDept">${departments.map((d,i)=>`<option value="${i}" ${state.builderDept===i?'selected':''}>${esc(d)}</option>`).join('')}</select></div><div class="settings-row"><div><b>Campos do formulário</b><p>Use as setas para mudar a ordem.</p></div>${btn(`${I('plus')} Adicionar campo`,'addField','btn-sm btn-secondary')}</div><div class="admin-list" style="margin-top:12px">${state.builderFields.map((f,i)=>`<div class="admin-item"><span class="mini-icon">${I('file',16)}</span><div class="content"><b>${esc(f.name)}</b><small>${esc(f.type)} • ${f.required?'Obrigatório':'Opcional'}</small></div><div class="actions"><button class="btn btn-sm" title="Mover para cima" data-movefield="up:${i}">↑</button><button class="btn btn-sm" title="Mover para baixo" data-movefield="down:${i}">↓</button><button class="btn btn-sm btn-danger" data-removefield="${i}">${I('trash',13)}</button></div></div>`).join('')}</div><div style="margin-top:24px;display:flex;gap:10px">${btn('Salvar formulário','saveForm','btn-primary')}${btn('Pré-visualizar','previewBuilder')}</div></section><section class="card card-pad"><h3 class="section-heading" style="margin-bottom:16px">Pré-visualização</h3><p class="small muted">Assim o colaborador verá as perguntas.</p><div class="field" style="margin-top:22px">${state.builderFields.map(f=>`<div class="field"><label>${esc(f.name)} ${f.required?'<span class="required">*</span>':''}</label>${f.type==='Texto longo'?'<textarea placeholder="Digite sua resposta"></textarea>':'<input placeholder="Digite sua resposta">'}</div>`).join('')}</div></section></div>`}
function adminCompanies(){return `${adminHeading('Empresas','Cadastre as empresas atendidas pelo portal.',btn(`${I('plus')} Adicionar empresa`,'addCompany','btn-primary'))}<div class="card card-pad"><div class="info-note" style="margin-bottom:17px">${I('info')}<span>As empresas compartilham os mesmos departamentos. Criar uma empresa não duplica os grupos de segurança.</span></div><div class="admin-list">${companies.map((name,i)=>`<div class="admin-item"><span class="mini-icon">${I('building')}</span><div class="content"><b>${esc(name)}</b><small>Empresa ${String(i+1).padStart(2,'0')} • ${state.companyActive[i]?'Ativa':'Inativa'}</small></div><label class="small muted"><input aria-label="Ativar empresa ${esc(name)}" type="checkbox" class="toggle" data-togglecompany="${i}" ${state.companyActive[i]?'checked':''}></label><button class="btn btn-sm" data-editcompany="${i}">${I('edit',14)} Editar</button></div>`).join('')}</div></div>`}
function adminDepartments(){return `${adminHeading('Departamentos','Departamentos compartilhados entre todas as empresas.',btn(`${I('plus')} Novo departamento`,'addDepartment','btn-primary'))}<div class="card card-pad"><div class="admin-list">${departments.map((name,i)=>`<div class="admin-item"><span class="mini-icon">${I(['monitor','users','file','layout','building'][i])}</span><div class="content"><b>${esc(name)}</b><small>Compartilhado por ${companies.length} empresas</small></div><label class="small muted"><input aria-label="Ativar departamento ${esc(name)}" type="checkbox" class="toggle" data-toggledept="${i}" ${state.deptActive[i]?'checked':''}></label><button class="btn btn-sm" data-editdept="${i}">${I('edit',14)} Editar</button></div>`).join('')}</div></div>`}
function adminUsers(){return `${adminHeading('Usuários','Contas locais e grupos de acesso.',btn(`${I('plus')} Adicionar usuário`,'addUser','btn-primary'))}<div class="card card-pad"><div class="admin-list">${state.users.map((u,i)=>`<div class="admin-item"><span class="avatar">${u.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</span><div class="content"><b>${esc(u.name)}</b><small>${esc(u.mail)} • ${esc(u.groups)}</small></div><span class="pill ${u.active?'green':'neutral'}">${u.active?'Ativo':'Inativo'}</span><input aria-label="Ativar usuário ${esc(u.name)}" type="checkbox" class="toggle" data-toggleuser="${i}" ${u.active?'checked':''}><button class="btn btn-sm" data-edituser="${i}">${I('edit',14)} Editar</button></div>`).join('')}</div></div>`}
function adminGroups(){return `${adminHeading('Grupos e permissões','Visualize quais equipes podem acessar cada funcionalidade.',btn(`${I('plus')} Novo grupo`,'addGroup','btn-primary'))}<div class="grid-3">${state.groups.map((g,i)=>`<div class="card card-pad"><span class="mini-icon" style="margin-bottom:15px">${I('shield')}</span><h3 style="color:var(--navy);font-size:14px;margin:0 0 8px">${esc(g.name)}</h3><p class="small muted" style="line-height:1.6;min-height:42px">${esc(g.desc)}</p><div class="settings-row"><b>${g.n} integrantes</b><button class="btn btn-sm" data-editgroup="${i}">Gerenciar ${I('chevron',13)}</button></div></div>`).join('')}</div><div class="info-note" style="margin-top:18px">${I('lock')}<span>Permissões individuais, confidencialidade dos chamados e autorização por grupo precisam continuar sendo verificadas no backend. Ocultar menus não substitui controle de acesso.</span></div>`}
function planner(){return `${pageHeading('Integrações','Microsoft Planner','Configure e acompanhe a integração com os chamados.',btn(`${I('refresh')} Testar conexão`,'testPlanner'))}<div class="settings-grid"><section class="card card-pad"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:19px"><h2 class="section-heading">Conexão Microsoft</h2><span class="pill ${state.plannerConnected?'green':'amber'}">${state.plannerConnected?'Simulada como conectada':'Não conectada'}</span></div><div class="info-note">${I('info')}<span>Esta tela é um protótipo. A conexão, a sincronização e as credenciais reais não são executadas aqui.</span></div><div class="settings-row"><div><b>Conta</b><p>${state.plannerConnected?'integracao@exemplo.com (simulação)':'Nenhuma conta conectada'}</p></div>${btn(state.plannerConnected?'Desconectar':'Simular conexão',state.plannerConnected?'disconnectPlanner':'connectPlanner',state.plannerConnected?'btn-sm':'btn-sm btn-primary')}</div><div class="field" style="margin-top:17px"><label for="plannerPlan">Plano de destino</label><select id="plannerPlan"><option>Plano geral de TI</option><option>Atendimento interno</option></select></div><div class="field"><label for="plannerBucket">Bucket padrão</label><select id="plannerBucket"><option>Solicitações</option><option>Para fazer</option><option>Em andamento</option></select></div><div class="settings-row"><div><b>Automação de tarefas</b><p>Somente chamados comuns poderão ser sincronizados.</p></div><input aria-label="Ativar automação" type="checkbox" class="toggle" data-action="togglePlanner" ${state.plannerOn?'checked':''}></div><div style="display:flex;gap:8px;margin-top:20px">${btn(`${I('refresh')} Simular sincronização`,'syncPlanner','btn-primary')}${btn('Salvar configurações','savePlanner')}</div></section><section class="card card-pad"><h2 class="section-heading" style="margin-bottom:17px">Regras de sincronização</h2><div class="settings-row"><div><b>Título da tarefa</b><p>Nome do formulário, sem protocolo.</p></div>${I('check',16)}</div><div class="settings-row"><div><b>Protocolo</b><p>Armazenado na descrição da tarefa.</p></div>${I('check',16)}</div><div class="settings-row"><div><b>Chamados restritos</b><p>Não são enviados ao Planner.</p></div>${I('shield',16)}</div><div class="settings-row"><div><b>Última sincronização</b><p>Nenhuma sincronização real executada.</p></div>${I('clock',16)}</div><div class="info-note" style="margin-top:20px">${I('lock')}<span>Tokens, segredos e credenciais nunca devem ser exibidos na interface do administrador.</span></div></section></div>`}
function account(){return `${pageHeading('Meu perfil','Minha conta','Consulte seus dados e preferências de acesso.')}<div class="settings-grid"><section class="card card-pad"><div style="display:flex;align-items:center;gap:13px;margin-bottom:23px"><span class="avatar" style="width:53px;height:53px;font-size:17px">${state.admin?'JP':'MS'}</span><div><h2 class="section-heading">${state.admin?'João Pereira':'Marina Souza'}</h2><p class="small muted" style="margin:5px 0">${state.admin?'Administrador':'Colaboradora'} • Conta local</p></div></div>${[['Nome',state.admin?'João Pereira':'Marina Souza'],['E-mail',state.admin?'joao.pereira@exemplo.com':'marina.souza@exemplo.com'],['Grupo',state.admin?'Equipe de TI, Administradores':'Colaboradores'],['Autenticação','Usuário e senha do portal']].map(([k,v])=>`<div class="settings-row"><span class="muted small">${k}</span><b>${esc(v)}</b></div>`).join('')}<div style="margin-top:20px">${btn(`${I('key')} Alterar senha`,'passwordModal')}</div></section><section class="card card-pad"><h2 class="section-heading" style="margin-bottom:15px">Visualização do protótipo</h2><p class="small muted" style="line-height:1.8">Troque entre as visões de colaborador e administrador para entender como o menu deve se adaptar às permissões.</p><div class="field" style="margin-top:20px"><label for="viewRole">Exibir interface como</label><select id="viewRole"><option value="colab" ${!state.admin?'selected':''}>Colaborador</option><option value="admin" ${state.admin?'selected':''}>Administrador</option></select></div><div class="info-note">${I('shield')}<span>Esta troca funciona apenas para demonstrar o design. No sistema real, o perfil deve vir de permissões validadas no servidor.</span></div><div style="margin-top:20px">${btn(`${I('logout')} Sair do portal`,'logout')}</div></section></div>`}
function recovery(){return `${adminHeading('Recuperação','Chamados excluídos logicamente na demonstração.') }<div class="card card-pad"><div class="info-note">${I('shield')}<span>Exclusões administrativas devem exigir confirmação, motivo e registro de auditoria.</span></div>${state.deletedTickets.length?`<div class="admin-list" style="margin-top:20px">${state.deletedTickets.map(id=>{const t=state.tickets.find(x=>x.id===id);return `<div class="admin-item"><span class="mini-icon">${I('trash')}</span><div class="content"><b>${esc(t?.title)}</b><small>${esc(id)} • Excluído logicamente</small></div><button class="btn btn-sm" data-restore="${esc(id)}">Restaurar</button></div>`}).join('')}</div>`:empty('Nenhum chamado na lixeira','Chamados excluídos por administradores aparecerão aqui para recuperação.')}</div>`}
function login(){return `<div class="login-screen"><section class="login-visual"><div class="login-logo"><span>C+</span> Service Desk</div><div><div class="login-title">Um jeito mais simples de pedir ajuda no trabalho.</div><p class="login-desc">Abra solicitações, acompanhe o atendimento e encontre tudo o que precisa em um único lugar.</p></div><div class="login-footer">C+ Service Desk • Portal de atendimento interno</div></section><section class="login-form-wrap"><div class="login-form"><div class="eyebrow">Bem-vindo de volta</div><h1>Entre na sua conta</h1><p>Use suas credenciais do portal para continuar.</p><div class="field" style="margin-top:30px"><label for="loginUser">Usuário</label><input id="loginUser" type="text" autocomplete="username" placeholder="Digite seu usuário" value="marina.souza"></div><div class="field"><label for="loginPassword">Senha</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Digite sua senha" value="demonstracao"></div><button class="btn btn-primary" data-action="login">Entrar no portal ${I('arrow',16)}</button><div class="info-note" style="margin-top:21px">${I('info')}<span>Login ilustrativo. Qualquer usuário e senha preenchidos permitem voltar à demonstração.</span></div></div></section></div>`}
function modalHtml(){const m=state.modal;if(!m)return '';const type=m.type;let inner='';if(type==='delete'){inner=`<h2>Excluir chamado?</h2><p>A solicitação <b>${esc(state.ticketId)}</b> será movida para a recuperação administrativa. Informe um motivo.</p><div class="field"><label for="deleteReason">Motivo da exclusão <span class="required">*</span></label><textarea id="deleteReason" placeholder="Por que este chamado será excluído?"></textarea></div>`}
else if(type==='password'){inner=`<h2>Alterar senha</h2><p>Simulação de alteração da senha local do portal.</p><div class="field"><label>Senha atual</label><input type="password" placeholder="Senha atual"></div><div class="field"><label>Nova senha</label><input type="password" placeholder="Nova senha"></div>`}
else if(type==='addField'){inner=`<h2>Adicionar campo</h2><div class="field"><label for="fName">Pergunta do campo</label><input id="fName" placeholder="Ex.: Nome do colaborador"></div><div class="field"><label for="fType">Tipo de campo</label><select id="fType"><option>Texto curto</option><option>Texto longo</option><option>Número</option><option>Data</option></select></div><label class="small"><input type="checkbox" id="fRequired" checked> Campo obrigatório</label>`}
else if(type==='manage'){inner=`<h2>${esc(m.title)}</h2><p>Edite as informações de cadastro nesta demonstração.</p><div class="field"><label for="manageName">Nome</label><input id="manageName" value="${esc(m.value||'')}"></div>`}
else if(type==='preview'){inner=`<h2>Pré-visualização</h2><p>O formulário <b>${esc(m.name)}</b> será exibido aos colaboradores do departamento correspondente.</p><div class="field"><label>Assunto <span class="required">*</span></label><input placeholder="Digite o assunto"></div><div class="field"><label>Descrição <span class="required">*</span></label><textarea placeholder="Descreva sua solicitação"></textarea></div>`}
return `<div class="modal-veil" data-action="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div id="modalTitle" class="visually-hidden">Janela de confirmação</div>${inner}<div class="modal-actions"><button class="btn" data-action="closeModal">Cancelar</button>${type==='preview'?'':`<button class="btn ${type==='delete'?'btn-danger':'btn-primary'}" data-action="confirmModal">${type==='delete'?'Excluir chamado':type==='addField'?'Adicionar':type==='password'?'Salvar':'Salvar alterações'}</button>`}</div></div></div>`}
function render(){let content='';switch(state.page){case'home':content=dashboard();break;case'wizard':content=wizard();break;case'mine':content=listTickets(false);break;case'tickets':content=listTickets(true);break;case'detail':content=detail();break;case'forms':content=adminForms();break;case'companies':content=adminCompanies();break;case'departments':content=adminDepartments();break;case'users':content=adminUsers();break;case'groups':content=adminGroups();break;case'planner':content=planner();break;case'account':content=account();break;case'recovery':content=recovery();break;case'login':$('#app').innerHTML=login();return;default:content=dashboard()}$('#app').innerHTML=shell(content)}
function nextWizard(){const w=state.wizard;if(w.step===0&&w.company===null)return toast('Selecione a empresa antes de continuar.');if(w.step===1&&w.department===null)return toast('Selecione um departamento.');if(w.step===2&&!w.form)return toast('Escolha o tipo de solicitação.');if(w.step===3&&(!w.title.trim()||!w.description.trim()))return toast('Preencha o assunto e a descrição para continuar.');if(w.step<4){w.step=(w.step===0&&w.form&&w.department!==null)?3:w.step+1;render();return}const n=state.tickets.length+151;const id=`CH-2026-${String(n).padStart(4,'0')}`;state.tickets.unshift({id,title:w.title.trim(),form:state.formDrafts.find(x=>x.id===w.form)?.name||'Solicitação',company:w.company,department:w.department,requester:state.admin?'João Pereira':'Marina Souza',status:'Aguardando atendimento',priority:w.urgency,assignee:'A definir',created:new Date().toISOString().slice(0,10),description:w.description.trim()+(w.details?`\nLocal: ${w.details}`:''),comments:[]});state.successId=id;render()}
function handleAction(action){const w=state.wizard;switch(action){case'toggleMobile':state.mobile=!state.mobile;render();break;case'closeMobile':state.mobile=false;render();break;case'notices':toast('Você está em um protótipo. Não há notificações reais.');break;case'openWizard':go('wizard');break;case'openList':go(state.admin?'tickets':'mine');break;case'wizardBack':if(w.step===0)go('home');else{w.step--;render()}break;case'wizardNext':nextWizard();break;case'viewCreated':state.ticketId=state.successId;go('detail');break;case'pagePrev':state.pageNum=Math.max(1,state.pageNum-1);render();break;case'pageNext':state.pageNum++;render();break;case'sendComment':{const input=$('#newComment');if(!input?.value.trim())return toast('Escreva um comentário antes de enviar.');currentTicket()?.comments.push({author:state.admin?'João Pereira':'Marina Souza',body:input.value.trim(),date:new Date().toLocaleDateString('pt-BR')});toast('Comentário adicionado à demonstração.');render();break}case'completeTicket':currentTicket().status='Concluído';toast('Chamado marcado como concluído.');render();break;case'askDelete':state.modal={type:'delete'};render();break;case'closeModal':state.modal=null;render();break;case'confirmModal':confirmModal();break;case'newForm':state.formBuilder=true;state.editingFormId=null;state.builderName='';state.builderFields=[{name:'Assunto',type:'Texto curto',required:true},{name:'Descrição',type:'Texto longo',required:true}];render();break;case'builderBack':state.formBuilder=false;render();break;case'addField':state.modal={type:'addField'};render();break;case'saveForm':{const name=$('#builderName')?.value.trim()||state.builderName;if(!name)return toast('Informe o nome do formulário.');const dept=Number($('#builderDept')?.value??state.builderDept);if(state.editingFormId){const item=state.formDrafts.find(f=>f.id===state.editingFormId);if(item){item.name=name;item.department=dept}}else if(!state.formDrafts.some(f=>f.name===name)){state.formDrafts.push({id:'custom'+Date.now(),name,desc:'Formulário interno personalizado',icon:'file',department:dept})}state.editingFormId=null;state.formBuilder=false;toast('Formulário salvo na demonstração.');render();break}case'previewBuilder':{state.builderName=$('#builderName')?.value||state.builderName;toast('A pré-visualização aparece à direita do construtor.');break}case'connectPlanner':state.plannerConnected=true;toast('Conexão simulada — não foi acessada nenhuma conta Microsoft.');render();break;case'disconnectPlanner':state.plannerConnected=false;state.plannerOn=false;render();break;case'togglePlanner':if(!state.plannerConnected){toast('Simule a conexão antes de ativar a automação.');render();return}state.plannerOn=!state.plannerOn;toast(state.plannerOn?'Automação simulada ativada.':'Automação simulada pausada.');render();break;case'syncPlanner':toast('Sincronização simulada. Nenhum dado foi enviado ao Planner.');break;case'testPlanner':toast(state.plannerConnected?'Conexão simulada ativa.':'Não existe uma conexão Microsoft real no protótipo.');break;case'savePlanner':toast('Configurações salvas apenas nesta demonstração.');break;case'passwordModal':state.modal={type:'password'};render();break;case'logout':state.page='login';render();break;case'login':if(!$('#loginUser')?.value||!$('#loginPassword')?.value)return toast('Informe usuário e senha para continuar.');state.page='home';state.admin=false;render();break;default:toast('Esta ação está representada no protótipo visual.')}}
function confirmModal(){const m=state.modal;if(m.type==='delete'){if(!$('#deleteReason')?.value.trim())return toast('Informe o motivo da exclusão.');state.deletedTickets.push(state.ticketId);state.modal=null;toast('Chamado movido para a recuperação administrativa.');go('tickets');return}if(m.type==='addField'){const name=$('#fName')?.value.trim();if(!name)return toast('Informe a pergunta do campo.');state.builderFields.push({name,type:$('#fType')?.value||'Texto curto',required:$('#fRequired')?.checked??true});state.modal=null;render();return}if(m.type==='manage'){const name=$('#manageName')?.value.trim();if(!name)return toast('Informe um nome.');if(m.kind==='company')companies[m.index]=name;else if(m.kind==='dept')departments[m.index]=name;else if(m.kind==='user')state.users[m.index].name=name;else if(m.kind==='group')state.groups[m.index].name=name;else if(m.kind==='newCompany')companies.push(name),state.companyActive.push(true);else if(m.kind==='newDept')departments.push(name),state.deptActive.push(true);else if(m.kind==='newUser')state.users.push({name,mail:'novo.usuario@exemplo.com',groups:'Colaboradores',active:true});else if(m.kind==='newGroup')state.groups.push({name,n:0,desc:'Grupo personalizado'});state.modal=null;toast('Cadastro atualizado apenas nesta demonstração.');render();return}state.modal=null;toast('Ação simulada; nenhuma credencial real foi modificada.');render()}
function openManage(kind,index=null){const config={company:['Empresa',companies],dept:['Departamento',departments],user:['Usuário',state.users.map(u=>u.name)],group:['Grupo',state.groups.map(g=>g.name)],newCompany:['Nova empresa',[]],newDept:['Novo departamento',[]],newUser:['Novo usuário',[]],newGroup:['Novo grupo',[]]};const [label,arr]=config[kind];state.modal={type:'manage',title:`${index===null?'Adicionar':'Editar'} ${label.toLowerCase()}`,value:index===null?'':arr[index],kind,index};render()}
function clickHandler(e){if(e.target.closest('.modal')===null&&e.target.closest('[data-action="closeModal"]')&&state.modal){state.modal=null;render();return}const goBtn=e.target.closest('[data-go]');if(goBtn){go(goBtn.dataset.go);return}const ticket=e.target.closest('[data-ticket]');if(ticket){state.ticketId=ticket.dataset.ticket;go('detail');return}const choice=e.target.closest('[data-choose]');if(choice){const k=choice.dataset.choose,v=choice.dataset.value;if(k==='company'){state.wizard.company=+v;if(!state.wizard.form){state.wizard.department=null;state.wizard.form=null}}if(k==='department'){state.wizard.department=+v;state.wizard.form=null}if(k==='form'){state.wizard.form=v}render();return}const quick=e.target.closest('[data-formquick]');if(quick){resetWizard();state.wizard.form=quick.dataset.formquick;state.wizard.department=state.formDrafts.find(f=>f.id===state.wizard.form)?.department??0;state.wizard.step=0;state.page='wizard';render();return}const remove=e.target.closest('[data-removefile]');if(remove){state.wizard.files.splice(Number(remove.dataset.removefile),1);render();return}const restore=e.target.closest('[data-restore]');if(restore){state.deletedTickets=state.deletedTickets.filter(x=>x!==restore.dataset.restore);toast('Chamado restaurado.');render();return}const preview=e.target.closest('[data-previewform]');if(preview){const f=state.formDrafts.find(x=>x.id===preview.dataset.previewform);state.modal={type:'preview',name:f.name};render();return}const editForm=e.target.closest('[data-editform]');if(editForm){const f=state.formDrafts.find(x=>x.id===editForm.dataset.editform);state.formBuilder=true;state.editingFormId=f.id;state.builderName=f.name;state.builderDept=f.department;state.builderFields=[{name:'Assunto',type:'Texto curto',required:true},{name:'Descrição',type:'Texto longo',required:true}];render();return}const removeField=e.target.closest('[data-removefield]');if(removeField){state.builderFields.splice(Number(removeField.dataset.removefield),1);render();return}const moveField=e.target.closest('[data-movefield]');if(moveField){const [d,s]=moveField.dataset.movefield.split(':');const i=Number(s),dest=d==='up'?i-1:i+1;if(dest>=0&&dest<state.builderFields.length){const temp=state.builderFields[i];state.builderFields[i]=state.builderFields[dest];state.builderFields[dest]=temp}render();return}const funcs=['company','dept','user','group'];for(const kind of funcs){const btn=e.target.closest(`[data-edit${kind}]`);if(btn){openManage(kind,Number(btn.dataset[`edit${kind}`]));return}}const act=e.target.closest('[data-action]');if(!act)return;const a=act.dataset.action;const newKinds={addCompany:'newCompany',addDepartment:'newDept',addUser:'newUser',addGroup:'newGroup'};if(newKinds[a]){openManage(newKinds[a]);return}handleAction(a)}
document.addEventListener('click',clickHandler);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-ticket]')){state.ticketId=e.target.dataset.ticket;go('detail')}if(e.key==='Escape'&&state.modal){state.modal=null;render()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='statusFilter'){state.filter=t.value;state.pageNum=1;render()}if(t.id==='viewRole'){state.admin=t.value==='admin';go('home')}if(t.id==='wfile'){const valid=['application/pdf','image/png','image/jpeg'];for(const f of [...t.files]){if(state.wizard.files.length>=5){toast('São permitidos no máximo 5 anexos.');break}if(!valid.includes(f.type)||f.size>2*1024*1024){toast(`Arquivo inválido ou maior que 2 MB: ${f.name}`);continue}state.wizard.files.push({name:f.name,size:f.size})}render()}if(t.dataset.togglecompany!==undefined){state.companyActive[Number(t.dataset.togglecompany)]=t.checked;toast('Status da empresa atualizado na demonstração.')}if(t.dataset.toggledept!==undefined){state.deptActive[Number(t.dataset.toggledept)]=t.checked;toast('Status do departamento atualizado na demonstração.')}if(t.dataset.toggleuser!==undefined){state.users[Number(t.dataset.toggleuser)].active=t.checked;toast('Status do usuário atualizado na demonstração.')}if(t.id==='builderDept')state.builderDept=Number(t.value)});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='searchTickets'){const pos=t.selectionStart;state.search=t.value;state.pageNum=1;render();const next=$('#searchTickets');if(next){next.focus();next.setSelectionRange(pos,pos)}}if(t.dataset.wfield){state.wizard[t.dataset.wfield]=t.value}if(t.id==='builderName')state.builderName=t.value});
render();
})();
</script>
</body></html>
