[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "cmais-service-desk"
version = "0.1.0"
description = "Portal interno de suporte da C+ Contadores"
requires-python = ">=3.12"
dependencies = [
  "Django==5.2.18",
  "celery[redis]==5.6.3",
  "django-environ==0.13.0",
  "psycopg[binary]==3.3.6",
  "gunicorn==25.3.0",
  "whitenoise==6.12.0",
  "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-django==4.14.0", "ruff==0.15.22", "PyYAML==6.0.3"]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", ".tmp", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"*/migrations/*.py" = ["I001"]
