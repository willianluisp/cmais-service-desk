name: cmais-service-desk-isolated

services:
  web:
    image: cmais-service-desk:isolated
    build:
      context: .
      args:
        INSTALL_LDAP: ${INSTALL_LDAP:-false}
    env_file: &isolated_env_files
      - .env.isolated
      - path: ${LOCALAPPDATA:?LOCALAPPDATA deve estar definido}/CmaisServiceDesk/isolated/microsoft.env
        format: raw
    environment: &isolated_environment
      DJANGO_SETTINGS_MODULE: config.settings.development
      PORTAL_BASE_URL: http://localhost:8010
      ALLOWED_HOSTS: localhost
      CSRF_TRUSTED_ORIGINS: http://localhost:8010
      MICROSOFT_GRAPH_APPROVED: "false"
      GRAPH_DELEGATED_OAUTH_ENABLED: "false"
      PLANNER_ENABLED: "false"
      PLANNER_TEST_ENABLED: "false"
      PLANNER_ATTACHMENTS_ENABLED: "false"
      GRAPH_ATTACHMENTS_STORAGE_APPROVED: "false"
      GRAPH_ATTACHMENT_SCOPE_ENABLED: "false"
      EMAIL_ENABLED: "false"
      SESSION_COOKIE_NAME: cmais_isolated_sessionid
      CSRF_COOKIE_NAME: cmais_isolated_csrftoken
      DATABASE_URL: postgresql://portal:${POSTGRES_PASSWORD}@db:5432/service_desk
      REDIS_URL: redis://redis:6379/0
    command: [gunicorn, config.wsgi:application, --bind, 0.0.0.0:8000, --workers, "2", --timeout, "30"]
    ports: ["127.0.0.1:8010:8000"]
    volumes: [isolated_attachments:/app/media]
    depends_on: [db, redis]
  worker:
    image: cmais-service-desk:isolated
    env_file: *isolated_env_files
    environment:
      <<: *isolated_environment
      DJANGO_SETTINGS_MODULE: config.settings.development
      PORTAL_BASE_URL: http://localhost:8010
      DATABASE_URL: postgresql://portal:${POSTGRES_PASSWORD}@db:5432/service_desk
      REDIS_URL: redis://redis:6379/0
    command: [celery, -A, config, worker, --loglevel=WARNING]
    depends_on: [db, redis]
  beat:
    image: cmais-service-desk:isolated
    env_file: *isolated_env_files
    environment:
      <<: *isolated_environment
      DJANGO_SETTINGS_MODULE: config.settings.development
      PORTAL_BASE_URL: http://localhost:8010
      DATABASE_URL: postgresql://portal:${POSTGRES_PASSWORD}@db:5432/service_desk
      REDIS_URL: redis://redis:6379/0
    command: [celery, -A, config, beat, --loglevel=WARNING, --schedule=/tmp/celerybeat-schedule]
    depends_on: [db, redis]
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: service_desk
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [isolated_postgres:/var/lib/postgresql/data]
  redis:
    image: redis:7.4-alpine
    volumes: [isolated_redis:/data]

volumes:
  isolated_attachments:
  isolated_postgres:
  isolated_redis:
